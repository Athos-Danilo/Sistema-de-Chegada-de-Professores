<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo arredondado estilo App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#gradBg)" />
  
  <!-- Crachá Base -->
  <rect x="156" y="100" width="200" height="280" rx="30" fill="transparent" stroke="url(#gradBlue)" stroke-width="24" />
  
  <!-- Furo do crachá -->
  <rect x="226" y="120" width="60" height="16" rx="8" fill="url(#gradBlue)" />
  
  <!-- Foto silhueta (Professor) -->
  <circle cx="256" cy="220" r="40" fill="url(#gradBlue)" />
  <path d="M 186 330 C 186 280, 326 280, 326 330" fill="none" stroke="url(#gradBlue)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Checkmark flutuante de Presença com Glow -->
  <path d="M 280 380 L 340 440 L 460 280" fill="none" stroke="url(#gradGreen)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
